# Local 3-node cluster: one control plane (also runs ingress-nginx) and two workers,
# so you can practise scheduling, drains and PodDisruptionBudgets.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pgs
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # http://localhost:8080 -> ingress-nginx on the control-plane node
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
