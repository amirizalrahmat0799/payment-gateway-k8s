# Applied after the kube-prometheus-stack chart, which installs the monitoring CRDs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - service-monitor.yaml
  - alerts.yaml

configMapGenerator:
  - name: payment-gateway-dashboard
    files:
      - payment-gateway-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"      # picked up by the Grafana sidecar
