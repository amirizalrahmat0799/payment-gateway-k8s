# payment-service: Payments API, idempotency, transactional outbox
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: backend
spec:
  # No `replicas`: the HorizontalPodAutoscaler owns the replica count.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # never drop below the desired replica count during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: payment-service
      terminationGracePeriodSeconds: 40
      # Don't inject <SERVICE>_PORT env vars for every Service in the namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: pgs/payment-service:local
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: pgs-config
            - secretRef:
                name: pgs-db
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/payment_db
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: pgs-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: CLIENTS_MERCHANT_BASE_URL
              value: http://merchant-service:8081
            - name: CLIENTS_TOKENIZATION_BASE_URL
              value: http://tokenization-service:8083
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi          # no CPU limit: avoids throttling the JVM; memory limit caps the heap (MaxRAMPercentage=75)
          # Spring Boot can take a while to start: the startup probe holds off liveness until it is up.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36      # up to 3 minutes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness   # includes the database check
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give Services/Ingress time to stop routing here before Spring starts its graceful shutdown.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp          # Tomcat's work directory
      volumes:
        - name: tmp
          emptyDir: {}
