# React dashboard served by nginx, which also proxies /merchant-api, /payment-api, /token-api
# and /settlement-api to the backend Services (see the dashboard repo's nginx template).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: merchant-dashboard
  labels:
    app.kubernetes.io/name: merchant-dashboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-dashboard
  labels:
    app.kubernetes.io/name: merchant-dashboard
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: merchant-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-dashboard
  labels:
    app.kubernetes.io/name: merchant-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: merchant-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: merchant-dashboard
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: merchant-dashboard
      # Don't inject <SERVICE>_PORT env vars for every Service in the namespace.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # "nginx" user in the unprivileged image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: pgs/merchant-dashboard:local
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MERCHANT_SERVICE_URL
              value: http://merchant-service:8081
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8082
            - name: TOKEN_SERVICE_URL
              value: http://tokenization-service:8083
            - name: SETTLEMENT_SERVICE_URL
              value: http://settlement-service:8084
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d     # rendered from the template at startup
            - name: tmp
              mountPath: /tmp                  # pid file and proxy/client caches
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
