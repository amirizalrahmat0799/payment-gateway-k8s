# Zero-trust inside the namespace: deny all ingress traffic, then allow only the calls
# the architecture needs. (Enforced only if the cluster's CNI supports NetworkPolicy.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Internet -> ingress-nginx -> dashboard
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: merchant-dashboard
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
# dashboard (nginx proxy) -> all four backend APIs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-dashboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: merchant-dashboard
---
# payment-service -> merchant-service (API key check) and tokenization-service (card lookup)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-and-token-from-payment
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["merchant-service", "tokenization-service"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
---
# settlement CronJob -> settlement-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: settlement-from-cronjob
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: settlement-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: settlement-nightly
      ports:
        - port: 8084
---
# backends -> PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-backends
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - port: 5432
---
# payment-service (outbox relay) and settlement-service (consumer) -> Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-from-producers-and-consumers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["payment-service", "settlement-service"]
      ports:
        - port: 9092
---
# Prometheus (monitoring namespace) -> /actuator/prometheus on the backends
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
